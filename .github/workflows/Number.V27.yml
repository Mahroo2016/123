name: Build APK V27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/dailynumber
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > gradle.properties <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          PROPERTIES

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DailyNumber"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.dailynumber'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.dailynumber'
                  minSdk 23
                  targetSdk 35
                  versionCode 27
                  versionName '2.7'
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          GRADLE

          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources><string name="app_name">عدد روزانه</string></resources>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          XML

          cat > app/src/main/res/xml/file_paths.xml <<'XML'
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
              <external-files-path name="external_files" path="." />
          </paths>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" android:label="@string/app_name" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider android:name="androidx.core.content.FileProvider" android:authorities="com.example.dailynumber.fileprovider" android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/example/dailynumber/MainActivity.java <<'JAVA'
          package com.example.dailynumber;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.ApplicationInfo;
          import android.graphics.*;
          import android.net.Uri;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.util.*;
          import org.json.*;

          public class MainActivity extends Activity {
              private SharedPreferences prefs;
              private JSONObject data;
              private EditText input;
              private TextView dateText,totalText;
              private LinearLayout list;
              private String selectedKey;

              @Override public void onCreate(Bundle b){
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  prefs=getSharedPreferences("daily_number",MODE_PRIVATE);
                  load(); showMain();
              }
              private void load(){try{data=new JSONObject(prefs.getString("data","{}"));}catch(Exception e){data=new JSONObject();}}
              private void save(){prefs.edit().putString("data",data.toString()).apply();}
              private TextView text(String s,float size){TextView v=new TextView(this);v.setText(s);v.setTextSize(size);v.setTextColor(Color.DKGRAY);v.setPadding(10,10,10,10);return v;}
              private Button button(String s){Button b=new Button(this);b.setText(s);return b;}

              private void showMain(){
                  LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(16,10,16,10);root.setBackgroundColor(Color.WHITE);
                  LinearLayout top=new LinearLayout(this);
                  TextView title=text("عدد روزانه",23);title.setTypeface(Typeface.DEFAULT,Typeface.BOLD);title.setGravity(Gravity.CENTER);
                  top.addView(title,new LinearLayout.LayoutParams(0,-2,1));
                  Button report=button("گزارش");top.addView(report);report.setOnClickListener(v->showReport());root.addView(top);

                  totalText=text("",19);totalText.setGravity(Gravity.CENTER);totalText.setTypeface(Typeface.DEFAULT,Typeface.BOLD);root.addView(totalText);
                  LinearLayout dr=new LinearLayout(this);dr.setGravity(Gravity.CENTER_VERTICAL);
                  dateText=text("",17);dateText.setGravity(Gravity.CENTER);dr.addView(dateText,new LinearLayout.LayoutParams(0,-2,1));
                  Button choose=button("تاریخ شمسی");dr.addView(choose);choose.setOnClickListener(v->pickDate());root.addView(dr);

                  input=new EditText(this);input.setHint("عدد را وارد کنید");input.setInputType(2);input.setGravity(Gravity.CENTER);root.addView(input);
                  LinearLayout actions=new LinearLayout(this);Button add=button("ثبت"),edit=button("اصلاح"),reset=button("ریست");
                  actions.addView(add,new LinearLayout.LayoutParams(0,-2,1));actions.addView(edit,new LinearLayout.LayoutParams(0,-2,1));actions.addView(reset,new LinearLayout.LayoutParams(0,-2,1));root.addView(actions);
                  add.setOnClickListener(v->saveValue());edit.setOnClickListener(v->saveValue());reset.setOnClickListener(v->resetAll());
                  TextView h=text("روزهای ثبت‌شده",18);h.setTypeface(Typeface.DEFAULT,Typeface.BOLD);root.addView(h);
                  ScrollView sc=new ScrollView(this);list=new LinearLayout(this);list.setOrientation(LinearLayout.VERTICAL);sc.addView(list);root.addView(sc,new LinearLayout.LayoutParams(-1,0,1));
                  setContentView(root);selectToday();refresh();
              }

              private void showReport(){
                  StringBuilder s=new StringBuilder("گزارش عدد روزانه\n\n");long total=0;ArrayList<String> ks=keys();Collections.sort(ks,Collections.reverseOrder());
                  for(String k:ks){long n=num(k);total+=n;s.append(jalaliFromKey(k)).append(" : ").append(n).append("\n");}
                  s.append("\nجمع کل: ").append(total).append("\nتعداد روزها: ").append(ks.size());
                  new AlertDialog.Builder(this).setTitle("گزارش").setMessage(s.toString()).setPositiveButton("بستن",null).setNeutralButton("اشتراک",(d,w)->shareText(s.toString())).show();
              }
              private void shareText(String s){Intent i=new Intent(Intent.ACTION_SEND);i.setType("text/plain");i.putExtra(Intent.EXTRA_TEXT,s);startActivity(Intent.createChooser(i,"ارسال گزارش"));}
              private void selectToday(){Calendar c=Calendar.getInstance();selectedKey=key(c.get(Calendar.YEAR),c.get(Calendar.MONTH)+1,c.get(Calendar.DAY_OF_MONTH));showSelected();}
              private String key(int y,int m,int d){return String.format(Locale.US,"%04d-%02d-%02d",y,m,d);}
              private long num(String k){try{return data.getLong(k);}catch(Exception e){return 0;}}
              private ArrayList<String> keys(){ArrayList<String>a=new ArrayList<>();Iterator<String>it=data.keys();while(it.hasNext())a.add(it.next());return a;}
              private void showSelected(){dateText.setText("تاریخ: "+jalaliFromKey(selectedKey));try{input.setText(data.has(selectedKey)?String.valueOf(data.getLong(selectedKey)):"");}catch(Exception e){input.setText("");}}

              private void pickDate(){
                  int[] j=gregToJalali(selectedKey);LinearLayout box=new LinearLayout(this);box.setGravity(Gravity.CENTER);
                  NumberPicker y=new NumberPicker(this),m=new NumberPicker(this),d=new NumberPicker(this);y.setMinValue(1300);y.setMaxValue(1500);m.setMinValue(1);m.setMaxValue(12);d.setMinValue(1);d.setMaxValue(31);y.setValue(j[0]);m.setValue(j[1]);d.setValue(j[2]);box.addView(y);box.addView(m);box.addView(d);
                  AlertDialog dlg=new AlertDialog.Builder(this).setTitle("انتخاب تاریخ شمسی").setView(box).setNegativeButton("لغو",null).setPositiveButton("انتخاب",null).create();
                  dlg.setOnShowListener(x->dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{int[]g=jalaliToGreg(y.getValue(),m.getValue(),d.getValue());if(g==null){Toast.makeText(this,"تاریخ نامعتبر است",Toast.LENGTH_SHORT).show();return;}selectedKey=key(g[0],g[1],g[2]);showSelected();dlg.dismiss();}));dlg.show();
              }

              private void saveValue(){String s=input.getText().toString().trim();if(s.isEmpty()){Toast.makeText(this,"لطفاً عدد را وارد کنید",Toast.LENGTH_SHORT).show();return;}try{long n=Long.parseLong(s);if(n<0)throw new Exception();data.put(selectedKey,n);save();refresh();Toast.makeText(this,"ثبت شد",Toast.LENGTH_SHORT).show();}catch(Exception e){Toast.makeText(this,"عدد واردشده صحیح نیست",Toast.LENGTH_SHORT).show();}}
              private void resetAll(){new AlertDialog.Builder(this).setTitle("ریست اطلاعات").setMessage("همه اطلاعات حذف شوند؟").setNegativeButton("لغو",null).setPositiveButton("حذف",(d,w)->{data=new JSONObject();save();input.setText("");refresh();Toast.makeText(this,"پاک شد",Toast.LENGTH_SHORT).show();}).show();}

              private void refresh(){list.removeAllViews();long total=0;ArrayList<String>ks=keys();for(String k:ks)total+=num(k);totalText.setText("جمع کل: "+total);if(ks.isEmpty()){TextView e=text("هنوز عددی ثبت نشده است",16);e.setGravity(Gravity.CENTER);list.addView(e);return;}Collections.sort(ks,Collections.reverseOrder());for(String k:ks){LinearLayout row=new LinearLayout(this);TextView d=text(jalaliFromKey(k),17),v=text(String.valueOf(num(k)),17);d.setGravity(Gravity.CENTER);v.setGravity(Gravity.CENTER);row.addView(d,new LinearLayout.LayoutParams(0,-2,1));row.addView(v,new LinearLayout.LayoutParams(0,-2,1));row.setOnClickListener(x->{selectedKey=k;showSelected();});list.addView(row);View line=new View(this);line.setBackgroundColor(Color.LTGRAY);list.addView(line,new LinearLayout.LayoutParams(-1,1));}}

              private String jalaliFromKey(String k){String[]p=k.split("-");return jalali(Integer.parseInt(p[0]),Integer.parseInt(p[1]),Integer.parseInt(p[2]));}
              private String jalali(int gy,int gm,int gd){int[]gdm={0,31,28,31,30,31,30,31,31,30,31,30,31};int gy2=gy-1600,gm2=gm-1,gd2=gd-1;long gDay=365L*gy2+(gy2+3)/4-(gy2+99)/100+(gy2+399)/400;for(int i=0;i<gm2;i++)gDay+=gdm[i+1];if(gm2>1&&((gy%4==0&&gy%100!=0)||gy%400==0))gDay++;gDay+=gd2;long jDay=gDay-79,jNp=jDay/12053;jDay%=12053;int jy=(int)(979+33*jNp+4*(jDay/1461));jDay%=1461;if(jDay>=366){jy+=(int)((jDay-1)/365);jDay=(jDay-1)%365;}int jm=jDay<186?1+(int)(jDay/31):7+(int)((jDay-186)/30);int jd=1+(int)(jDay<186?jDay%31:(jDay-186)%30);return String.format(Locale.US,"%04d/%02d/%02d",jy,jm,jd);}
              private int[] gregToJalali(String k){String[]p=k.split("-");String[]j=jalali(Integer.parseInt(p[0]),Integer.parseInt(p[1]),Integer.parseInt(p[2])).split("/");return new int[]{Integer.parseInt(j[0]),Integer.parseInt(j[1]),Integer.parseInt(j[2])};}
              private int[] jalaliToGreg(int jy,int jm,int jd){if(jm<1||jm>12||jd<1||jd>31)return null;int jy2=jy-979;long jDay=365L*jy2+(jy2/33)*8+((jy2%33)+3)/4;if(jm<=6)jDay+=(jm-1)*31;else jDay+=(jm-7)*30+186;jDay+=jd-1;long gDay=jDay+79;int gy=1600+400*(int)(gDay/146097);gDay%=146097;boolean leap=true;if(gDay>=36525){gDay--;gy+=100*(int)(gDay/36524);gDay%=36524;if(gDay>=365)gDay++;}gy+=4*(int)(gDay/1461);gDay%=1461;if(gDay>=366){leap=false;gDay--;gy+=(int)(gDay/365);gDay%=365;}int[]md={31,leap?29:28,31,30,31,30,31,31,30,31,30,31};int gm=1;while(gm<=12&&gDay>=md[gm-1]){gDay-=md[gm-1];gm++;}return new int[]{gy,gm,(int)gDay+1};}
          }
          JAVA

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify AndroidX
        shell: bash
        run: |
          set -e
          echo '--- gradle.properties ---'
          cat gradle.properties
          echo '--- app/build.gradle ---'
          cat app/build.gradle
          test "$(grep -c '^android.useAndroidX=true$' gradle.properties)" = "1"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Check APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyNumber-APK-V27
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
