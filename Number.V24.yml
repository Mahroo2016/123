package com.mahr.numberdaily;

import android.app.Activity;
import android.app.AlertDialog;
import android.content.SharedPreferences;
import android.graphics.Color;
import android.os.Bundle;
import android.text.InputType;
import android.view.Gravity;
import android.view.View;
import android.widget.*;

import org.json.JSONArray;
import org.json.JSONObject;

import java.text.DecimalFormat;
import java.util.ArrayList;
import java.util.Calendar;
import java.util.Collections;
import java.util.Comparator;
import java.util.Locale;

public class MainActivity extends Activity {

    private SharedPreferences prefs;

    private final ArrayList<Record> records = new ArrayList<>();

    private TextView totalView;
    private TextView daysView;
    private EditText dateInput;
    private EditText weightInput;
    private LinearLayout listContainer;

    static class Record {
        String date;
        double weight;

        Record(String date, double weight) {
            this.date = date;
            this.weight = weight;
        }
    }

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        prefs = getSharedPreferences(
                "WEIGHT_DAILY_DATA",
                MODE_PRIVATE
        );

        load();

        buildScreen();

        refresh();
    }

    private TextView makeText(String value, float size) {

        TextView t = new TextView(this);

        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(Color.rgb(35, 35, 35));

        t.setPadding(
                12,
                8,
                12,
                8
        );

        return t;
    }

    private Button makeButton(String value) {

        Button b = new Button(this);

        b.setText(value);
        b.setAllCaps(false);

        return b;
    }

    private String persian(String value) {

        return value
                .replace("0", "۰")
                .replace("1", "۱")
                .replace("2", "۲")
                .replace("3", "۳")
                .replace("4", "۴")
                .replace("5", "۵")
                .replace("6", "۶")
                .replace("7", "۷")
                .replace("8", "۸")
                .replace("9", "۹");
    }

    private String englishNumbers(String value) {

        return value
                .replace("۰", "0")
                .replace("۱", "1")
                .replace("۲", "2")
                .replace("۳", "3")
                .replace("۴", "4")
                .replace("۵", "5")
                .replace("۶", "6")
                .replace("۷", "7")
                .replace("۸", "8")
                .replace("۹", "9")
                .replace("٫", ".")
                .replace("،", ".");
    }

    private void buildScreen() {

        LinearLayout root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                18,
                16,
                18,
                12
        );

        root.setBackgroundColor(
                Color.WHITE
        );


        TextView title =
                makeText(
                        "ثبت وزن روزانه",
                        27
                );

        title.setGravity(
                Gravity.CENTER
        );

        root.addView(title);


        totalView =
                makeText(
                        "",
                        23
                );

        totalView.setGravity(
                Gravity.CENTER
        );

        root.addView(totalView);


        daysView =
                makeText(
                        "",
                        17
                );

        daysView.setGravity(
                Gravity.CENTER
        );

        root.addView(daysView);


        TextView dateLabel =
                makeText(
                        "تاریخ شمسی",
                        17
                );

        root.addView(dateLabel);


        LinearLayout dateRow =
                new LinearLayout(this);

        dateRow.setOrientation(
                LinearLayout.HORIZONTAL
        );


        dateInput =
                new EditText(this);

        dateInput.setHint(
                "مثلاً ۱۴۰۵/۰۵/۳۰"
        );

        dateInput.setSingleLine(true);

        dateInput.setInputType(
                InputType.TYPE_CLASS_NUMBER
        );

        dateInput.setText(
                persian(
                        todayJalali()
                )
        );


        dateRow.addView(
                dateInput,
                new LinearLayout.LayoutParams(
                        0,
                        -2,
                        1
                )
        );


        Button todayButton =
                makeButton(
                        "امروز"
                );

        dateRow.addView(
                todayButton
        );

        todayButton.setOnClickListener(
                v ->
                        dateInput.setText(
                                persian(
                                        todayJalali()
                                )
                        )
        );


        root.addView(dateRow);


        TextView weightLabel =
                makeText(
                        "وزن",
                        17
                );

        root.addView(weightLabel);


        weightInput =
                new EditText(this);

        weightInput.setHint(
                "مثلاً ۷۵.۴"
        );

        weightInput.setSingleLine(true);

        weightInput.setInputType(
                InputType.TYPE_CLASS_NUMBER
                        |
                InputType.TYPE_NUMBER_FLAG_DECIMAL
        );

        root.addView(
                weightInput
        );


        Button save =
                makeButton(
                        "ثبت / اصلاح این روز"
                );

        root.addView(
                save
        );


        save.setOnClickListener(
                v ->
                        saveRecord()
        );


        TextView listTitle =
                makeText(
                        "لیست کامل روزهای ثبت‌شده",
                        20
                );

        listTitle.setGravity(
                Gravity.CENTER
        );

        root.addView(
                listTitle
        );


        ScrollView scroll =
                new ScrollView(this);

        listContainer =
                new LinearLayout(this);

        listContainer.setOrientation(
                LinearLayout.VERTICAL
        );

        scroll.addView(
                listContainer
        );


        root.addView(
                scroll,
                new LinearLayout.LayoutParams(
                        -1,
                        0,
                        1
                )
        );


        Button reset =
                makeButton(
                        "ریست همه اطلاعات"
                );

        root.addView(
                reset
        );


        reset.setOnClickListener(
                v ->
                        resetAll()
        );


        setContentView(root);
    }

    private void saveRecord() {

        String date =
                englishNumbers(
                        dateInput
                                .getText()
                                .toString()
                                .trim()
                );

        String weightText =
                englishNumbers(
                        weightInput
                                .getText()
                                .toString()
                                .trim()
                );


        if (!isValidJalaliDate(date)) {

            dateInput.setError(
                    "تاریخ را مثل ۱۴۰۵/۰۵/۳۰ وارد کنید"
            );

            return;
        }


        if (weightText.isEmpty()) {

            weightInput.setError(
                    "وزن را وارد کنید"
            );

            return;
        }


        double weight;

        try {

            weight =
                    Double.parseDouble(
                            weightText
                                    .replace(
                                            ',',
                                            '.'
                                    )
                    );

        } catch (Exception e) {

            weightInput.setError(
                    "وزن معتبر نیست"
            );

            return;
        }


        boolean found =
                false;


        for (Record r : records) {

            if (r.date.equals(date)) {

                r.weight =
                        weight;

                found =
                        true;

                break;
            }
        }


        if (!found) {

            records.add(
                    new Record(
                            date,
                            weight
                    )
            );
        }


        sortRecords();

        save();

        weightInput.setText("");

        refresh();


        Toast.makeText(
                this,
                found
                        ? "وزن این روز اصلاح شد"
                        : "وزن ثبت شد",
                Toast.LENGTH_SHORT
        ).show();
    }

    private boolean isValidJalaliDate(
            String date
    ) {

        if (
                !date.matches(
                        "\\d{4}/\\d{2}/\\d{2}"
                )
        ) {
            return false;
        }


        try {

            String[] p =
                    date.split("/");

            int y =
                    Integer.parseInt(p[0]);

            int m =
                    Integer.parseInt(p[1]);

            int d =
                    Integer.parseInt(p[2]);


            if (y < 1200 || y > 1600) {
                return false;
            }

            if (m < 1 || m > 12) {
                return false;
            }

            int max;

            if (m <= 6) {
                max = 31;
            } else if (m <= 11) {
                max = 30;
            } else {
                max = 30;
            }

            return d >= 1 && d <= max;

        } catch (Exception e) {

            return false;
        }
    }

    private void refresh() {

        double total =
                0;


        for (Record r : records) {

            total +=
                    r.weight;
        }


        totalView.setText(
                "جمع کل وزن روزهای ثبت‌شده: "
                        +
                persian(
                        format(total)
                )
        );


        daysView.setText(
                "تعداد روزهای ثبت‌شده: "
                        +
                persian(
                        String.valueOf(
                                records.size()
                        )
                )
        );


        listContainer.removeAllViews();


        if (records.isEmpty()) {

            TextView empty =
                    makeText(
                            "هنوز هیچ روزی ثبت نشده است",
                            17
                    );

            empty.setGravity(
                    Gravity.CENTER
            );

            listContainer.addView(
                    empty
            );

            return;
        }


        for (
                int i = 0;
                i < records.size();
                i++
        ) {

            addRecordRow(i);
        }
    }

    private void addRecordRow(
            int index
    ) {

        Record r =
                records.get(index);


        LinearLayout row =
                new LinearLayout(this);

        row.setOrientation(
                LinearLayout.VERTICAL
        );

        row.setPadding(
                8,
                8,
                8,
                8
        );

        row.setBackgroundColor(
                Color.rgb(
                        245,
                        245,
                        245
                )
        );


        TextView info =
                makeText(
                        "تاریخ: "
                                +
                        persian(
                                r.date
                        )
                                +
                        "\nوزن: "
                                +
                        persian(
                                format(
                                        r.weight
                                )
                        ),
                        17
                );


        row.addView(
                info
        );


        LinearLayout actions =
                new LinearLayout(this);

        actions.setGravity(
                Gravity.RIGHT
        );


        Button edit =
                makeButton(
                        "اصلاح"
                );

        Button delete =
                makeButton(
                        "حذف"
                );


        actions.addView(
                edit
        );

        actions.addView(
                delete
        );


        row.addView(
                actions
        );


        edit.setOnClickListener(
                v ->
                        editRecord(
                                index
                        )
        );


        delete.setOnClickListener(
                v ->
                        deleteRecord(
                                index
                        )
        );


        listContainer.addView(
                row
        );


        Space space =
                new Space(this);

        listContainer.addView(
                space,
                new LinearLayout.LayoutParams(
                        1,
                        10
                )
        );
    }

    private void editRecord(
            int index
    ) {

        Record r =
                records.get(index);


        LinearLayout box =
                new LinearLayout(this);

        box.setOrientation(
                LinearLayout.VERTICAL
        );


        EditText date =
                new EditText(this);

        date.setSingleLine(true);

        date.setHint(
                "تاریخ شمسی"
        );

        date.setText(
                persian(
                        r.date
                )
        );


        EditText weight =
                new EditText(this);

        weight.setSingleLine(true);

        weight.setInputType(
                InputType.TYPE_CLASS_NUMBER
                        |
                InputType.TYPE_NUMBER_FLAG_DECIMAL
        );

        weight.setHint(
                "وزن"
        );

        weight.setText(
                format(
                        r.weight
                )
        );


        box.addView(date);

        box.addView(weight);


        new AlertDialog.Builder(
                this
        )

                .setTitle(
                        "اصلاح رکورد"
                )

                .setView(
                        box
                )

                .setNegativeButton(
                        "لغو",
                        null
                )

                .setPositiveButton(
                        "ذخیره",
                        (
                                dialog,
                                which
                        ) -> {

                            String newDate =
                                    englishNumbers(
                                            date
                                                    .getText()
                                                    .toString()
                                                    .trim()
                                    );


                            String newWeight =
                                    englishNumbers(
                                            weight
                                                    .getText()
                                                    .toString()
                                                    .trim()
                                    );


                            if (
                                    !isValidJalaliDate(
                                            newDate
                                    )
                            ) {

                                Toast.makeText(
                                        this,
                                        "تاریخ معتبر نیست",
                                        Toast.LENGTH_SHORT
                                ).show();

                                return;
                            }


                            try {

                                double w =
                                        Double.parseDouble(
                                                newWeight
                                                        .replace(
                                                                ',',
                                                                '.'
                                                        )
                                        );


                                for (
                                        int i = 0;
                                        i < records.size();
                                        i++
                                ) {

                                    if (
                                            i != index
                                                    &&
                                            records
                                                    .get(i)
                                                    .date
                                                    .equals(
                                                            newDate
                                                    )
                                    ) {

                                        Toast.makeText(
                                                this,
                                                "این تاریخ قبلاً ثبت شده است",
                                                Toast.LENGTH_SHORT
                                        ).show();

                                        return;
                                    }
                                }


                                r.date =
                                        newDate;

                                r.weight =
                                        w;


                                sortRecords();

                                save();

                                refresh();


                            } catch (
                                    Exception e
                            ) {

                                Toast.makeText(
                                        this,
                                        "وزن معتبر نیست",
                                        Toast.LENGTH_SHORT
                                ).show();
                            }
                        }
                )

                .show();
    }

    private void deleteRecord(
            int index
    ) {

        Record r =
                records.get(index);


        new AlertDialog.Builder(
                this
        )

                .setTitle(
                        "حذف رکورد"
                )

                .setMessage(
                        "رکورد "
                                +
                        persian(
                                r.date
                        )
                                +
                        " حذف شود؟"
                )

                .setNegativeButton(
                        "لغو",
                        null
                )

                .setPositiveButton(
                        "حذف",
                        (
                                dialog,
                                which
                        ) -> {

                            records.remove(
                                    index
                            );

                            save();

                            refresh();
                        }
                )

                .show();
    }

    private void resetAll() {

        new AlertDialog.Builder(
                this
        )

                .setTitle(
                        "ریست همه اطلاعات"
                )

                .setMessage(
                        "تمام روزهای ثبت‌شده حذف شوند؟"
                )

                .setNegativeButton(
                        "لغو",
                        null
                )

                .setPositiveButton(
                        "ریست",
                        (
                                dialog,
                                which
                        ) -> {

                            records.clear();

                            save();

                            refresh();

                            Toast.makeText(
                                    this,
                                    "همه اطلاعات پاک شد",
                                    Toast.LENGTH_SHORT
                            ).show();
                        }
                )

                .show();
    }

    private void sortRecords() {

        Collections.sort(
                records,
                new Comparator<Record>() {

                    @Override
                    public int compare(
                            Record a,
                            Record b
                    ) {

                        return b.date.compareTo(
                                a.date
                        );
                    }
                }
        );
    }

    private void save() {

        JSONArray array =
                new JSONArray();


        try {

            for (
                    Record r :
                    records
            ) {

                JSONObject object =
                        new JSONObject();

                object.put(
                        "date",
                        r.date
                );

                object.put(
                        "weight",
                        r.weight
                );

                array.put(
                        object
                );
            }

        } catch (Exception ignored) {
        }


        prefs.edit()
                .putString(
                        "records",
                        array.toString()
                )
                .apply();
    }

    private void load() {

        String data =
                prefs.getString(
                        "records",
                        "[]"
                );


        try {

            JSONArray array =
                    new JSONArray(
                            data
                    );


            for (
                    int i = 0;
                    i < array.length();
                    i++
            ) {

                JSONObject object =
                        array.getJSONObject(
                                i
                        );


                records.add(
                        new Record(
                                object.getString(
                                        "date"
                                ),
                                object.getDouble(
                                        "weight"
                                )
                        )
                );
            }


            sortRecords();

        } catch (
                Exception ignored
        ) {

            records.clear();
        }
    }

    private String format(
            double value
    ) {

        if (
                Math.abs(
                        value -
                        Math.rint(value)
                ) < 0.0000001
        ) {

            return String.valueOf(
                    (long)
                    Math.rint(value)
            );
        }


        return new DecimalFormat(
                "0.########"
        ).format(
                value
        );
    }

    private String todayJalali() {

        Calendar c =
                Calendar.getInstance();


        return gregorianToJalali(
                c.get(
                        Calendar.YEAR
                ),
                c.get(
                        Calendar.MONTH
                ) + 1,
                c.get(
                        Calendar.DAY_OF_MONTH
                )
        );
    }

    private String gregorianToJalali(
            int gy,
            int gm,
            int gd
    ) {

        int[] days = {
                0,
                31,
                28,
                31,
                30,
                31,
                30,
                31,
                31,
                30,
                31,
                30,
                31
        };


        int gy2 =
                gy - 1600;

        int gm2 =
                gm - 1;

        int gd2 =
                gd - 1;


        int dayNo =
                365 * gy2
                        +
                (gy2 + 3) / 4
                        -
                (gy2 + 99) / 100
                        +
                (gy2 + 399) / 400;


        for (
                int i = 0;
                i < gm2;
                i++
        ) {

            dayNo +=
                    days[i + 1];
        }


        if (
                gm2 > 1
                        &&
                (
                        (
                                gy % 4 == 0
                                        &&
                                gy % 100 != 0
                        )
                                ||
                        gy % 400 == 0
                )
        ) {

            dayNo++;
        }


        dayNo +=
                gd2;


        int jDayNo =
                dayNo - 79;


        int jNp =
                jDayNo / 12053;


        jDayNo %=
                12053;


        int jy =
                979
                        +
                33 * jNp
                        +
                4 *
                (
                        jDayNo / 1461
                );


        jDayNo %=
                1461;


        if (
                jDayNo >= 366
        ) {

            jy +=
                    (
                            jDayNo - 1
                    ) / 365;

            jDayNo =
                    (
                            jDayNo - 1
                    ) % 365;
        }


        int jm;
        int jd;


        if (
                jDayNo < 186
        ) {

            jm =
                    1
                            +
                    jDayNo / 31;

            jd =
                    1
                            +
                    jDayNo % 31;

        } else {

            jm =
                    7
                            +
                    (
                            jDayNo - 186
                    ) / 30;

            jd =
                    1
                            +
                    (
                            jDayNo - 186
                    ) % 30;
        }


        return String.format(
                Locale.US,
                "%04d/%02d/%02d",
                jy,
                jm,
                jd
        );
    }
}
