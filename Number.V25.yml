name: Build APK V25

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/dailynumber
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DailyNumber"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.dailynumber'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.dailynumber'
                  minSdk 23
                  targetSdk 35
                  versionCode 25
                  versionName "2.5"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">عدد روزانه</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:colorAccent">#6750A4</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/dailynumber/MainActivity.java <<'EOF'
          package com.example.dailynumber;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.*;
          import android.widget.*;
          import java.text.SimpleDateFormat;
          import java.util.*;
          import org.json.*;

          public class MainActivity extends Activity {
              private static final String PREF = "daily_number_data";
              private SharedPreferences prefs;
              private JSONObject data;
              private TextView totalText, selectedDateText, emptyText;
              private EditText valueInput;
              private LinearLayout listLayout;
              private String selectedKey;

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  prefs = getSharedPreferences(PREF, MODE_PRIVATE);
                  loadData();
                  buildUi();
                  selectToday();
                  refreshList();
              }

              private void loadData() {
                  try { data = new JSONObject(prefs.getString("json", "{}")); }
                  catch(Exception e) { data = new JSONObject(); }
              }

              private void saveData() {
                  prefs.edit().putString("json", data.toString()).apply();
              }

              private TextView tv(String text, float sp) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextSize(sp);
                  v.setTextColor(Color.rgb(30,30,30));
                  v.setPadding(12,12,12,12);
                  return v;
              }

              private Button btn(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(15);
                  return b;
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(20, 14, 20, 10);
                  root.setBackgroundColor(Color.WHITE);

                  TextView title = tv("عدد روزانه", 25);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, new LinearLayout.LayoutParams(-1, -2));

                  totalText = tv("", 19);
                  totalText.setGravity(Gravity.CENTER);
                  totalText.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  root.addView(totalText, new LinearLayout.LayoutParams(-1, -2));

                  LinearLayout dateRow = new LinearLayout(this);
                  dateRow.setGravity(Gravity.CENTER_VERTICAL);
                  selectedDateText = tv("", 17);
                  selectedDateText.setGravity(Gravity.CENTER);
                  Button dateBtn = btn("انتخاب تاریخ");
                  dateRow.addView(selectedDateText, new LinearLayout.LayoutParams(0,-2,1));
                  dateRow.addView(dateBtn, new LinearLayout.LayoutParams(-2,-2));
                  root.addView(dateRow);

                  dateBtn.setOnClickListener(v -> showDatePicker());

                  valueInput = new EditText(this);
                  valueInput.setHint("عدد را وارد کنید");
                  valueInput.setInputType(2);
                  valueInput.setGravity(Gravity.CENTER);
                  root.addView(valueInput, new LinearLayout.LayoutParams(-1,-2));

                  LinearLayout actions = new LinearLayout(this);
                  actions.setGravity(Gravity.CENTER);
                  Button saveBtn = btn("ثبت");
                  Button editBtn = btn("اصلاح");
                  Button resetBtn = btn("ریست");
                  actions.addView(saveBtn, new LinearLayout.LayoutParams(0,-2,1));
                  actions.addView(editBtn, new LinearLayout.LayoutParams(0,-2,1));
                  actions.addView(resetBtn, new LinearLayout.LayoutParams(0,-2,1));
                  root.addView(actions);

                  TextView listTitle = tv("لیست روزهای ثبت‌شده", 18);
                  listTitle.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  root.addView(listTitle);

                  ScrollView scroll = new ScrollView(this);
                  listLayout = new LinearLayout(this);
                  listLayout.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(listLayout);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1,0,1));

                  saveBtn.setOnClickListener(v -> saveSelected(false));
                  editBtn.setOnClickListener(v -> saveSelected(true));
                  resetBtn.setOnClickListener(v -> confirmReset());

                  setContentView(root);
              }

              private void selectToday() {
                  Calendar c = Calendar.getInstance();
                  selectedKey = key(c.get(Calendar.YEAR), c.get(Calendar.MONTH)+1, c.get(Calendar.DAY_OF_MONTH));
                  showSelected();
              }

              private String key(int y,int m,int d) {
                  return String.format(Locale.US,"%04d-%02d-%02d",y,m,d);
              }

              private void showDatePicker() {
                  Calendar c = Calendar.getInstance();
                  try {
                      String[] p = selectedKey.split("-");
                      c.set(Integer.parseInt(p[0]), Integer.parseInt(p[1])-1, Integer.parseInt(p[2]));
                  } catch(Exception ignored) {}
                  DatePickerDialog dlg = new DatePickerDialog(this, (view,y,m,d) -> {
                      selectedKey = key(y,m+1,d);
                      showSelected();
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH));
                  dlg.setTitle("انتخاب روز");
                  dlg.show();
              }

              private void showSelected() {
                  String[] p = selectedKey.split("-");
                  int y=Integer.parseInt(p[0]), m=Integer.parseInt(p[1]), d=Integer.parseInt(p[2]);
                  selectedDateText.setText("تاریخ: " + jalali(y,m,d));
                  try { valueInput.setText(data.has(selectedKey) ? String.valueOf(data.getLong(selectedKey)) : ""); }
                  catch(Exception e) { valueInput.setText(""); }
              }

              private void saveSelected(boolean edit) {
                  String s = valueInput.getText().toString().trim();
                  if (s.isEmpty()) {
                      Toast.makeText(this,"لطفاً عدد را وارد کنید",Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      long n = Long.parseLong(s);
                      if (n < 0) throw new Exception();
                      data.put(selectedKey,n);
                      saveData();
                      refreshList();
                      Toast.makeText(this, edit ? "اصلاح شد" : "ثبت شد", Toast.LENGTH_SHORT).show();
                  } catch(Exception e) {
                      Toast.makeText(this,"عدد واردشده صحیح نیست",Toast.LENGTH_SHORT).show();
                  }
              }

              private void confirmReset() {
                  new AlertDialog.Builder(this)
                      .setTitle("ریست اطلاعات")
                      .setMessage("همه روزهای ثبت‌شده حذف شوند؟")
                      .setNegativeButton("لغو",null)
                      .setPositiveButton("حذف", (d,w) -> {
                          data = new JSONObject();
                          saveData();
                          valueInput.setText("");
                          refreshList();
                          Toast.makeText(this,"همه اطلاعات پاک شد",Toast.LENGTH_SHORT).show();
                      }).show();
              }

              private void refreshList() {
                  listLayout.removeAllViews();
                  ArrayList<String> keys = new ArrayList<>();
                  Iterator<String> it = data.keys();
                  while(it.hasNext()) keys.add(it.next());
                  Collections.sort(keys, Collections.reverseOrder());

                  long total=0;
                  for(String k: keys) {
                      try { total += data.getLong(k); } catch(Exception ignored) {}
                  }
                  totalText.setText("جمع کل: " + total);

                  if(keys.isEmpty()) {
                      emptyText = tv("هنوز عددی ثبت نشده است",16);
                      emptyText.setGravity(Gravity.CENTER);
                      listLayout.addView(emptyText);
                      return;
                  }

                  for(String k: keys) {
                      long n=0;
                      try { n=data.getLong(k); } catch(Exception ignored) {}
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.VERTICAL);
                      row.setPadding(10,8,10,8);

                      TextView date = tv(jalaliFromKey(k),16);
                      date.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                      TextView val = tv("عدد: " + n,16);
                      row.addView(date);
                      row.addView(val);

                      row.setOnClickListener(v -> {
                          selectedKey=k;
                          showSelected();
                          valueInput.requestFocus();
                      });
                      listLayout.addView(row);
                      View line = new View(this);
                      line.setBackgroundColor(Color.LTGRAY);
                      listLayout.addView(line,new LinearLayout.LayoutParams(-1,1));
                  }
              }

              private String jalaliFromKey(String k) {
                  String[] p=k.split("-");
                  return "تاریخ " + jalali(Integer.parseInt(p[0]),Integer.parseInt(p[1]),Integer.parseInt(p[2]));
              }

              // Gregorian -> Jalali conversion, based on the standard 2820-year cycle.
              private String jalali(int gy,int gm,int gd) {
                  int[] gdm={0,31,28,31,30,31,30,31,31,30,31,30,31};
                  int gy2=gy-1600, gm2=gm-1, gd2=gd-1;
                  long gDay=365L*gy2 + (gy2+3)/4 - (gy2+99)/100 + (gy2+399)/400;
                  for(int i=0;i<gm2;i++) gDay+=gdm[i+1];
                  if(gm2>1 && ((gy%4==0 && gy%100!=0)||gy%400==0)) gDay++;
                  gDay+=gd2;
                  long jDay=gDay-79;
                  long jNp=jDay/12053;
                  jDay%=12053;
                  int jy=(int)(979+33*jNp+4*(jDay/1461));
                  jDay%=1461;
                  if(jDay>=366) {
                      jy+=(int)((jDay-1)/365);
                      jDay=(jDay-1)%365;
                  }
                  int jm=(jDay<186)?1+(int)(jDay/31):7+(int)((jDay-186)/30);
                  int jd=1+(int)((jDay<186)?jDay%31:(jDay-186)%30);
                  return String.format(Locale.US,"%04d/%02d/%02d",jy,jm,jd);
              }
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyNumber-APK
          path: app/build/outputs/apk/debug/app-debug.apk
